name: ci
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.9.0", enable-cache: true}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/agentverse solutions/agentic_rag_end_to_end/app solutions/production_ai_security/app
      - run: uv run python -m solutions.production_ai_security.evals.run
      - run: uv run pytest tests solutions/agentic_rag_end_to_end/tests solutions/production_ai_security/tests --cov=agentverse --cov=solutions.agentic_rag_end_to_end.app --cov=solutions.production_ai_security.app --cov-report=xml
  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: agentverse:${{ github.sha }}
  security-container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: solutions/production_ai_security/Dockerfile
          push: false
          tags: agentverse-security:${{ github.sha }}
