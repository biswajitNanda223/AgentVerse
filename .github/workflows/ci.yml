name: ci
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.9.0", enable-cache: true}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python agents/production_security/evals/run.py
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest --cov=agentverse --cov=agentic_rag --cov=production_security --cov-report=xml
  images:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: agentverse, file: packages/agentverse/Dockerfile}
          - {name: agentverse-agentic-rag, file: agents/agentic_rag/Dockerfile}
          - {name: agentverse-security, file: agents/production_security/Dockerfile}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.name }}:${{ github.sha }}
