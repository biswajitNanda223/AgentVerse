[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentverse-production-security"
version = "0.1.0"
description = "Security-first ADK agent: consent, least privilege, signed skills, audit and evals"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = ["agentverse"]

[tool.uv.sources]
agentverse = {workspace = true}

[tool.hatch.build.targets.wheel]
packages = ["src/production_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
