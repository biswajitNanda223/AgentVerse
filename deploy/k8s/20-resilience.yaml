apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentverse-api
  namespace: agentverse
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: agentverse-api}
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentverse-api
  namespace: agentverse
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: agentverse-api}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: agentverse
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

