[project]
name = "agentverse-workspace"
version = "0.1.0"
description = "AgentVerse: Google ADK agent monorepo (uv workspace root, not published)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*", "agents/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["system_one_triage", "agentverse", "agentic_rag", "production_security", "event_worker"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["packages/agentverse/tests", "agents/system_one_triage/tests", "agents/agentic_rag/tests", "agents/production_security/tests", "agents/event_worker/tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["system_one_triage", "agentverse", "agentic_rag", "production_security", "event_worker"]

[[tool.mypy.overrides]]
module = ["numpy.*", "pytesseract.*", "PIL.*", "qdrant_client.*", "fitz.*", "pymupdf.*", "sentence_transformers.*", "aiokafka.*"]
ignore_missing_imports = true
follow_imports = "skip"
