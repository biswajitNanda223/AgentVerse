apiVersion: apps/v1
kind: Deployment
metadata: {name: agentic-rag-api, namespace: agentverse}
spec:
  replicas: 3
  selector: {matchLabels: {app: agentic-rag-api}}
  template:
    metadata: {labels: {app: agentic-rag-api}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/example/agentverse-agentic-rag:1.0.0
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - secretRef: {name: agentic-rag-secrets}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata: {name: agentic-rag-api, namespace: agentverse}
spec:
  selector: {app: agentic-rag-api}
  ports: [{port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: agentic-rag-api, namespace: agentverse}
spec:
  minReplicas: 3
  maxReplicas: 50
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: agentic-rag-api}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: agentic-rag-api, namespace: agentverse}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: agentic-rag-api}}

